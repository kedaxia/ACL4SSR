[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则

;去广告：支持
;自动测速：支持
;微软分流：不支持
;苹果分流：不支持
;增强中国IP段：不支持
;增强国外GFW：不支持

ruleset=🎯 全球直连,rules/ACL4SSR/Clash/LocalAreaNetwork.list
ruleset=🛑 全球拦截,rules/ACL4SSR/Clash/BanAD.list
ruleset=🛑 全球拦截,rules/ACL4SSR/Clash/BanProgramAD.list
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/GoogleCN.list
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/Ruleset/SteamCN.list

; ===== 新增：AI 服务分流 =====
ruleset=🤖 AI服务,rules/ACL4SSR/Clash/Ruleset/AI.list
ruleset=🤖 AI服务,rules/ACL4SSR/Clash/Ruleset/OpenAi.list

; ===== 新增：YouTube 分流 =====
ruleset=📺 油管视频,rules/ACL4SSR/Clash/Ruleset/YouTube.list

; ===== 原有 Telegram 分流（保持） =====
ruleset=📨 电报消息,rules/ACL4SSR/Clash/Telegram.list

ruleset=🚀 节点选择,rules/ACL4SSR/Clash/ProxyMedia.list
ruleset=🚀 节点选择,rules/ACL4SSR/Clash/ProxyLite.list
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/ChinaDomain.list
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/ChinaCompanyIp.list
;ruleset=🎯 全球直连,[]GEOIP,LAN
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ===== 策略组 =====
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; ===== 新增：按协议独立的测速组 =====
custom_proxy_group=⚡ SS 测速`url-test`(ss|SS|Shadowsocks)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=⚡ VMess 测速`url-test`(vmess|VMess|V2ray)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=⚡ VLESS 测速`url-test`(vless|VLESS)`http://www.gstatic.com/generate_204`300,,50

; ===== 新增服务的策略组 =====
custom_proxy_group=🤖 AI服务`select`[]🚀 节点选择`[]♻️ 自动选择`[]⚡ VMess 测速`[]⚡ VLESS 测速`[]⚡ SS 测速`[]DIRECT
custom_proxy_group=📺 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]⚡ VMess 测速`[]⚡ VLESS 测速`[]⚡ SS 测速`[]DIRECT
custom_proxy_group=📨 电报消息`select`[]🚀 节点选择`[]♻️ 自动选择`[]⚡ VMess 测速`[]⚡ VLESS 测速`[]⚡ SS 测速`[]DIRECT

; ===== 原有策略组 =====
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`.*

enable_rule_generator=true
overwrite_original_rules=true
